[system]
compatible=beingos-lab-v1
bootloader=grub
grubenv=/bootstate/EFI/BOOT/grubenv
data-directory=/bootstate/rauc
mountprefix=/run/rauc
bundle-formats=verity

[keyring]
path=/etc/rauc/keyring.pem
# The laptop's clock can reset to a date before the certificate was made
# (an old RTC cell). Check the certificate at the bundle's own signed time.
use-bundle-signing-time=true

[handlers]
pre-install=/usr/libexec/being-update-ready

[slot.rootfs.0]
device=/dev/disk/by-partuuid/SLOT_A_UUID
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/SLOT_B_UUID
type=raw
bootname=B
