# Try PipOS boot menu for the hybrid ISO (lab/make-iso.sh).
#
# Written to a USB stick, the ISO is a GPT disk:
#   gpt1  ISO 9660 data (a README; nothing boots from it)
#   gpt2  try-esp      EFI System: bootx64.efi and this grub.cfg
#   gpt3  try-system   the read-only system (SquashFS, holds /boot/bzImage)
#   gpt4  try-models   the read-only model pack (ext4)
#   gpt5  try-logs     FAT32 PIPLOGS, first-boot diagnostics
# make-iso.sh sets the GPT names and partition GUIDs after xorriso has laid
# the partitions out, and replaces ISO_ROOT_UUID and ISO_MODELS_UUID here.
# BEING_LAPTOP_ARGS is replaced by boot_console() in slots.sh, as for the
# laptop Try media, so both carry the same laptop kernel arguments.
#
# The entries match the laptop Try media's (try-grub.cfg): the menu is drawn
# on the built-in panel through the EFI text console, waits 5 s and can be
# driven blind: Enter or nothing boots the first entry; v boots the
# boot-message entry, s safe graphics, m and n the alternative-microphone
# entries and b the speed measurement at once. None of them
# reboots on an oops, and none waits for ever for a missing USB root.
terminal_input console
terminal_output console
set gfxpayload=keep
set timeout_style=menu
set timeout=5
set default=0

# $root is the partition GRUB was loaded from, e.g. hd0,gpt2. The system
# partition is on the same disk, whatever the firmware called that disk.
regexp --set=1:pipos_disk '^([^,]+)' "$root"

menuentry "Try PipOS" {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS"
        # A panic stays on the screen for 30 s, then the Mac restarts
        # (from its startup disk unless Option is held again).
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}

menuentry "Try PipOS (show boot messages)" --hotkey=v {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS with boot messages"
        # Kernel and systemd text on the panel. A panic stays on screen:
        # no panic reboot and no hardware watchdog.
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS console=tty0 fbcon=nodefer loglevel=7 systemd.show_status=1 being.verbose=1 panic=0 systemd.watchdog_sec=off; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}

menuentry "Try PipOS (safe graphics)" --hotkey=s {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS with safe graphics"
        # No i915: the face draws on the firmware framebuffer (simpledrm)
        # with software rendering. Warnings stay visible; no panic reboot.
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS nomodeset console=tty0 loglevel=4 panic=0 systemd.watchdog_sec=off; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}

menuentry "Try PipOS (alternative microphone)" --hotkey=m {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS with the alternative microphone set-up"
        # The default entry with the MacBookPro8,1 internal-mic fixup; the voice
        # records both channels and keeps the one that sounds like speech.
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 snd_hda_intel.model=mbp81 being.mic_channel=auto; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}

menuentry "Try PipOS (alternative microphone 2)" --hotkey=n {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS with the second alternative microphone set-up"
        # The default entry with the codec's 2012 MacBook Pro fixup.
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 snd_hda_intel.model=mbp101; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}

menuentry "Try PipOS (measure speed)" --hotkey=b {
    if [ -f "($pipos_disk,gpt3)/boot/bzImage" ]; then
        echo "Trying PipOS and measuring its speed"
        # Bench mode: measures the models and voices and saves the numbers with the logs.
        if linux "($pipos_disk,gpt3)/boot/bzImage" root=PARTUUID=ISO_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=ISO_MODELS_UUID being.try=1 being.screen=1 fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 being.bench=1; then
            boot
        fi
    else
        echo "Cannot locate the PipOS Try media"
    fi
}
