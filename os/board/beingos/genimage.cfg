image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

	}

	size = 64M
}

image beingos.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition system-a {
		partition-type-uuid = L
		partition-uuid = SLOT_A_UUID
		image = "rootfs.squashfs"
		size = 1024M
	}

	partition system-b {
		partition-type-uuid = L
		partition-uuid = SLOT_B_UUID
		image = "rootfs.squashfs"
		size = 1024M
	}

	partition models {
		partition-type-uuid = L
		image = "models.ext4"
	}

	# Last, so it can be grown to fill a bigger disk.
	partition mind {
		partition-type-uuid = L
		image = "mind.ext4"
	}
}
