image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
	}
	size = 64M
}

#BEGIN try-logs: laptop Try media only (try-image.sh removes it otherwise)
image logs-part.vfat {
	vfat {
		label = "PIPLOGS"
		extraargs = "-F 32"
		file README.txt {
			image = "logs-part/README.txt"
		}
	}
	size = 128M
}
#END try-logs

image beingos-try.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "TRY_DISK_UUID"
		align = 1M
	}

	partition try-esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = "TRY_ESP_UUID"
		offset = 1M
		bootable = true
	}

	partition try-system {
		image = "rootfs.squashfs"
		partition-type-uuid = L
		partition-uuid = "TRY_ROOT_UUID"
		read-only = true
	}

	partition try-models {
		image = "models.ext4"
		partition-type-uuid = L
		partition-uuid = "TRY_MODELS_UUID"
		read-only = true
	}
#BEGIN try-logs
	# Diagnostics the owner reads on another computer (FAT32, Microsoft basic data).
	partition try-logs {
		image = "logs-part.vfat"
		partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
		partition-uuid = "TRY_LOGS_UUID"
	}
#END try-logs
}
