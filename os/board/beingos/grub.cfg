serial --unit=0 --speed=115200
terminal_output serial
set default=0
set timeout=0
set install_esp="INSTALL_ESP_UUID"

# RAUC owns ORDER, *_OK and *_TRY. A new install sets TRY=0.
# GOOD names the most recently confirmed slot and does not spend attempts.
# PIP_UNSEEN (installed disks only) counts boots of the confirmed slot that
# were not confirmed healthy again; being-boot-health resets it to 0.
set ORDER="A B"
set GOOD=A
set A_OK=1
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_LEFT=0
set B_LEFT=0
set PIP_UNSEEN=0
set envfile="($root)/EFI/BOOT/grubenv"
load_env -f "$envfile" ORDER GOOD A_OK A_TRY A_LEFT B_OK B_TRY B_LEFT PIP_UNSEEN
if ! regexp --set=1:disk '^(.*),gpt1$' "$root"; then
    unset disk
fi

if [ -n "$install_esp" ]; then
    # An installed being boots at once, but Esc during the first second shows
    # the menu, and the hotkeys pick an entry blind.
    set timeout_style=hidden
    set timeout=1
fi

# boot_slot SLOT [MODE]: MODE is empty (normal), messages, safe or previous.
function boot_slot {
    if [ -z "$disk" ]; then
        return
    fi
    if [ "$1" = A ]; then
        set part=2
        set uuid=SLOT_A_UUID
        set ok=$A_OK
        set tried=$A_TRY
        set left=$A_LEFT
    elif [ "$1" = B ]; then
        set part=3
        set uuid=SLOT_B_UUID
        set ok=$B_OK
        set tried=$B_TRY
        set left=$B_LEFT
    else
        return
    fi
    if [ "$ok" != 1 ]; then
        return
    fi
    set mode="$2"

    set trial=0
    if [ "$mode" = previous ]; then
        # Chosen by hand: one trial boot of the other slot, put first in
        # ORDER so a healthy boot keeps it. An unhealthy one reboots back
        # into the confirmed slot.
        set trial=1
        if [ "$1" = A ]; then
            set A_TRY=1
            set A_LEFT=0
            set ORDER="A B"
        else
            set B_TRY=1
            set B_LEFT=0
            set ORDER="B A"
        fi
        if ! save_env -f "$envfile" ORDER A_TRY A_LEFT B_TRY B_LEFT; then
            echo "Cannot record the trial boot for slot $1"
            return
        fi
    elif [ "$1" != "$GOOD" ]; then
        set trial=1
        if [ "$tried" = 0 ]; then
            set left=2
        elif [ "$left" = 2 ]; then
            set left=1
        elif [ "$left" = 1 ]; then
            set left=0
        else
            return
        fi
        if [ "$1" = A ]; then
            set A_TRY=1
            set A_LEFT=$left
        else
            set B_TRY=1
            set B_LEFT=$left
        fi
        if ! save_env -f "$envfile" A_TRY A_LEFT B_TRY B_LEFT; then
            echo "Cannot record the trial boot for slot $1"
            return
        fi
    elif [ -n "$install_esp" ]; then
        # The confirmed slot. After three boots in a row that never became
        # healthy (an oops, a hang, a dead organ), boot it with its messages
        # on the screen, no panic reboot and no watchdog, so it stops
        # looping and can be read.
        if [ "$PIP_UNSEEN" = 0 ]; then
            set PIP_UNSEEN=1
        elif [ "$PIP_UNSEEN" = 1 ]; then
            set PIP_UNSEEN=2
        elif [ "$PIP_UNSEEN" = 2 ]; then
            set PIP_UNSEEN=3
        else
            set PIP_UNSEEN=3
            if [ -z "$mode" ]; then
                set mode=messages
                echo "PipOS did not start properly three times; showing its messages"
            fi
        fi
        save_env -f "$envfile" PIP_UNSEEN
    fi

    if [ "$mode" = messages ]; then
        set extra="console=tty0 console=ttyS0,115200 fbcon=nodefer loglevel=7 systemd.show_status=1 being.verbose=1 panic=0 systemd.watchdog_sec=off BEING_LAPTOP_ARGS"
    elif [ "$mode" = safe ]; then
        set extra="nomodeset console=tty0 console=ttyS0,115200 loglevel=4 being.verbose=1 panic=0 systemd.watchdog_sec=off BEING_LAPTOP_ARGS"
    else
        set extra="loglevel=3 panic=10 oops=panic console=ttyS0,115200 BEING_LAPTOP_ARGS BEING_QUIET_ARGS"
    fi

    echo "PipOS slot $1"
    if [ -n "$install_esp" ]; then
        if linux "($disk,gpt$part)/boot/bzImage" root=PARTUUID=$uuid rootfstype=squashfs rootwait ro rauc.slot=$1 being.trial=$trial being.installed=1 being.esp=$install_esp being.slot_a=SLOT_A_UUID being.slot_b=SLOT_B_UUID being.models=INSTALL_MODELS_UUID being.mind=INSTALL_MIND_UUID fstab=no systemd.gpt_auto=no $extra; then
            boot
        fi
    else
        if linux "($disk,gpt$part)/boot/bzImage" root=PARTUUID=$uuid rootfstype=squashfs rootwait ro rauc.slot=$1 being.trial=$trial $extra; then
            boot
        fi
    fi
}

menuentry "PipOS" {
    for slot in $ORDER; do
        boot_slot "$slot"
    done
    echo "No bootable PipOS slot"
}

if [ -n "$install_esp" ]; then
    menuentry "PipOS (previous slot)" --hotkey=p {
        if [ "$GOOD" = A ]; then
            boot_slot B previous
        else
            boot_slot A previous
        fi
        echo "There is no previous PipOS slot to start"
    }

    menuentry "PipOS (show messages)" --hotkey=v {
        boot_slot "$GOOD" messages
        echo "The confirmed PipOS slot cannot be started"
    }

    menuentry "PipOS (safe graphics)" --hotkey=s {
        boot_slot "$GOOD" safe
        echo "The confirmed PipOS slot cannot be started"
    }
fi
