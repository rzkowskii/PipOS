serial --unit=0 --speed=115200
terminal_output serial
set default=0
set timeout=0
set install_esp="INSTALL_ESP_UUID"

# RAUC owns ORDER, *_OK and *_TRY. A new install sets TRY=0.
# GOOD names the most recently confirmed slot and does not spend attempts.
set ORDER="A B"
set GOOD=A
set A_OK=1
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_LEFT=0
set B_LEFT=0
set envfile="($root)/EFI/BOOT/grubenv"
load_env -f "$envfile" ORDER GOOD A_OK A_TRY A_LEFT B_OK B_TRY B_LEFT
if ! regexp --set=1:disk '^(.*),gpt1$' "$root"; then
    unset disk
fi

function boot_slot {
    if [ -z "$disk" ]; then
        return
    fi
    if [ "$1" = A ]; then
        set part=2
        set uuid=SLOT_A_UUID
        set ok=$A_OK
        set tried=$A_TRY
        set left=$A_LEFT
    elif [ "$1" = B ]; then
        set part=3
        set uuid=SLOT_B_UUID
        set ok=$B_OK
        set tried=$B_TRY
        set left=$B_LEFT
    else
        return
    fi
    if [ "$ok" != 1 ]; then
        return
    fi

    set trial=0
    if [ "$1" != "$GOOD" ]; then
        set trial=1
        if [ "$tried" = 0 ]; then
            set left=2
        elif [ "$left" = 2 ]; then
            set left=1
        elif [ "$left" = 1 ]; then
            set left=0
        else
            return
        fi
        if [ "$1" = A ]; then
            set A_TRY=1
            set A_LEFT=$left
        else
            set B_TRY=1
            set B_LEFT=$left
        fi
        if ! save_env -f "$envfile" A_TRY A_LEFT B_TRY B_LEFT; then
            echo "Cannot record the trial boot for slot $1"
            return
        fi
    fi

    echo "PipOS slot $1"
    if [ -n "$install_esp" ]; then
        if linux "($disk,gpt$part)/boot/bzImage" root=PARTUUID=$uuid rootfstype=squashfs rootwait ro rauc.slot=$1 being.trial=$trial being.installed=1 being.esp=$install_esp being.slot_a=SLOT_A_UUID being.slot_b=SLOT_B_UUID being.models=INSTALL_MODELS_UUID being.mind=INSTALL_MIND_UUID fstab=no systemd.gpt_auto=no console=ttyS0,115200 loglevel=3 panic=10 oops=panic; then
            boot
        fi
    else
        if linux "($disk,gpt$part)/boot/bzImage" root=PARTUUID=$uuid rootfstype=squashfs rootwait ro rauc.slot=$1 being.trial=$trial console=ttyS0,115200 loglevel=3 panic=10 oops=panic; then
            boot
        fi
    fi
}

menuentry "PipOS" {
    for slot in $ORDER; do
        boot_slot "$slot"
    done
    echo "No bootable PipOS slot"
}
