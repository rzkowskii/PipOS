# Try PipOS boot menu, shared by the lab and the laptop Try media.
#
# The lab image keeps its serial terminal and boots its single entry at once:
# the QEMU suites read that serial line. The whole lab entry sits on the next
# line, which starts with the serial command. For the laptop
# (BEING_TRY_LAPTOP=1), boot_console() in slots.sh deletes every line that
# starts with "serial --unit=" and the "terminal_output serial" line, so the
# laptop grub.cfg holds only the six on-screen entries further down (the
# laptop smoke test counts the menuentry lines) and being_lab stays unset.
serial --unit=0 --speed=115200; set being_lab=1; menuentry "Try PipOS" { if regexp --set=1:disk '^(.*),gpt1$' "$root"; then echo "Trying PipOS"; if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no console=ttyS0,115200 loglevel=3 panic=10 oops=panic; then boot; fi; else echo "Cannot locate the PipOS Try media"; fi; }
terminal_output serial
set default=0
set timeout=0

if [ "$being_lab" != 1 ]; then
    # The MacBook: the menu is drawn on the built-in panel through the EFI
    # text console (Apple firmware provides it over GOP; efi_gop is built in).
    # It waits 5 s and can be driven blind: Enter or nothing boots the first
    # entry; lower-case v boots the boot-message entry, s the safe-graphics
    # entry, m and n the two alternative-microphone entries and b the speed
    # measurement at once (GRUB 2.14 normal/menu.c runs a hotkey's entry;
    # pressing Enter afterwards as well does no harm). Down, Enter also works
    # blind.
    terminal_input console
    terminal_output console
    set gfxpayload=keep
    set timeout_style=menu
    set timeout=5
    set default=0

    # None of the Try entries reboot on an oops, and none waits for ever for
    # a missing USB root: after 60 s the kernel stops with a message on screen.
    menuentry "Try PipOS" {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS"
            # A panic stays on the screen for 30 s, then the Mac restarts
            # (from its startup disk unless Option is held again).
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }

    menuentry "Try PipOS (show boot messages)" --hotkey=v {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS with boot messages"
            # Kernel and systemd text on the panel. A panic stays on screen:
            # no panic reboot and no hardware watchdog.
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS console=tty0 fbcon=nodefer loglevel=7 systemd.show_status=1 being.verbose=1 panic=0 systemd.watchdog_sec=off; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }

    menuentry "Try PipOS (safe graphics)" --hotkey=s {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS with safe graphics"
            # No i915: the face draws on the firmware framebuffer (simpledrm)
            # with software rendering. Warnings stay visible; no panic reboot.
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS nomodeset console=tty0 loglevel=4 panic=0 systemd.watchdog_sec=off; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }

    menuentry "Try PipOS (alternative microphone)" --hotkey=m {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS with the alternative microphone set-up"
            # The default entry plus two microphone changes, for a being that
            # hears its name but not the words after it. The Cirrus codec gets
            # the MacBookPro8,1 internal-mic fixup, and the voice records both
            # channels and keeps the one that sounds like speech
            # (mind/mic_channel.py). The voice logs which channel it chose.
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 snd_hda_intel.model=mbp81 being.mic_channel=auto; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }

    menuentry "Try PipOS (alternative microphone 2)" --hotkey=n {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS with the second alternative microphone set-up"
            # The default entry with the codec's 2012 MacBook Pro fixup, which
            # sets up the digital microphone pins. One boot of each entry
            # tells which fixup suits this laptop's microphone.
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 snd_hda_intel.model=mbp101; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }

    menuentry "Try PipOS (measure speed)" --hotkey=b {
        if regexp --set=1:disk '^(.*),gpt1$' "$root"; then
            echo "Trying PipOS and measuring its speed"
            # The default entry in bench mode: the being measures its models
            # and voices on this laptop and saves the numbers with its logs.
            if linux "($disk,gpt2)/boot/bzImage" root=PARTUUID=TRY_ROOT_UUID rootfstype=squashfs rootwait=60 ro being.models=TRY_MODELS_UUID being.try=1 TRY_SCREEN fstab=no systemd.gpt_auto=no BEING_LAPTOP_ARGS quiet loglevel=3 panic=30 being.bench=1; then
                boot
            fi
        else
            echo "Cannot locate the PipOS Try media"
        fi
    }
fi
