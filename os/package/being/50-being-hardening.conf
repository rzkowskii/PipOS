# Kernel hardening for PipOS. Nothing on the appliance needs these doors, and
# the workshop cage (docs/design/voice-apps.md section 5) assumes they are shut.

# No user namespaces: a caged program cannot build its own root inside one.
# systemd's own sandboxing (mount and network namespaces) runs as root and
# does not need them.
user.max_user_namespaces = 0

# Only root may load BPF programs or read the kernel log and pointers.
kernel.unprivileged_bpf_disabled = 1
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
