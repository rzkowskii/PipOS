[Service]
# A missing or untrusted model skips this service and leaves the boot health
# gate unsatisfied. ExecCondition avoids a restart loop hashing rejected data.
# The check keeps its verdict cache in /mind/cortex/pack-verdict.json, so the
# folder is made first (outside the sandbox) and an unchanged model on the
# installed SSD is not hashed again on every boot (mind/model_pack.py).
ExecCondition=+/bin/mkdir -p /mind/cortex
ExecCondition=/usr/bin/python3 /usr/lib/being/mind/model_pack.py verify
